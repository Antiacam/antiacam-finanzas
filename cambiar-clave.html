<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antiacam · Cambiar contraseña</title><link rel="stylesheet" href="seguridad.css"></head><body><main>
<h1>Cambiar contraseña</h1><p id="mensaje" role="status" aria-live="polite">Validando acceso…</p>
<form id="cambio" hidden>
<label for="actual">Contraseña actual</label><input id="actual" type="password" autocomplete="current-password" required>
<label for="nueva">Nueva contraseña</label><input id="nueva" type="password" autocomplete="new-password" minlength="12" required>
<p>Use al menos 12 caracteres, con mayúsculas, minúsculas, números y símbolos.</p>
<label for="confirmar">Confirmar nueva contraseña</label><input id="confirmar" type="password" autocomplete="new-password" minlength="12" required>
<div id="reautenticar" hidden><p>Confirme el código de seguridad enviado a su correo.</p><label for="nonce">Código de seguridad del correo</label><input id="nonce" autocomplete="one-time-code" inputmode="numeric"></div>
<button id="guardar">Cambiar contraseña</button></form>
<p><a href="seguridad.html">Doble factor y equipos de confianza</a></p><p><a href="8010-fact_prov.html">Volver a Finanzas</a></p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="i01-base_conexion.js"></script><script src="cambiar-clave.js"></script></body></html>
